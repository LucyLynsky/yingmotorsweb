<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Contact Kate at Shandong Yingmotors: WhatsApp +86 180 5372 9906, WeChat k18053729906, yingmotorsinfo@gmail.com, Liangshan, Shandong.">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#210E06">
  <link rel="preconnect" href="https://webimages.yingmotors.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact" data-title="contact_title">
  <header class="site-header" id="site-header"></header>
  <section class="page-hero">
    <div class="wrap">
      <p class="kicker">Kate · WhatsApp / WeChat</p>
      <h1 data-i18n="contact_title"></h1>
      <p class="lead" data-i18n="contact_lead"></p>
    </div>
  </section>
  <section class="section">
    <div class="wrap contact-grid">
      <aside class="contact-card">
        <img src="assets/contact-tag.svg" alt="YING MOTORS WhatsApp and email">
        <dl>
          <div class="contact-item">
            <span class="contact-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V9l8-5 8 5v11H4z"/><path d="M10 20v-6h4v6"/></svg>
            </span>
            <div>
              <dt data-i18n="contact_company"></dt>
              <dd>Shandong Yingmotors Co.,Ltd</dd>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
            </span>
            <div>
              <dt data-i18n="contact_add"></dt>
              <dd>Liangshan County, Jining City, Shandong Province</dd>
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-3.4 3.4-5.2 6.5-5.2S17.7 16.6 18.5 20"/></svg>
            </span>
            <div>
              <dt data-i18n="contact_person"></dt>
              <dd>Kate</dd>
            </div>
          </div>
          <div class="contact-item" id="whatsapp">
            <span class="contact-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19.2l.7-2.6A7.8 7.8 0 1 1 12 19.8a8 8 0 0 1-3.3-.7L5 19.2z"/><path d="M9.2 9.6c.2-.5.3-.5.6-.5h.5c.2 0 .4.1.5.4l.5 1.2c.1.3 0 .5-.2.7l-.4.4a5.5 5.5 0 0 0 2.3 2.3l.4-.3c.2-.2.5-.3.7-.1l1.1.6c.3.2.3.4.3.6 0 .3-.2.7-.5.9-.3.2-.7.4-1.3.4-2.2 0-4.8-1.9-6-4.2-.5-1-.6-1.9-.4-2.5.1-.4.4-.7.7-.8z"/></svg>
            </span>
            <div>
              <dt data-i18n="contact_whatsapp"></dt>
              <dd><a href="https://wa.me/8618053729906" target="_blank" rel="noopener">+86 180 5372 9906</a></dd>
              <p class="muted contact-scan" data-i18n="contact_wa_scan"></p>
              <img class="qr-card" src="contact/WhatsApp.png" alt="WhatsApp QR — Kate YingMotors">
            </div>
          </div>
          <div class="contact-item">
            <span class="contact-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v11H4z"/><path d="M4 7l8 6 8-6"/></svg>
            </span>
            <div>
              <dt data-i18n="contact_email"></dt>
              <dd><a href="mailto:yingmotorsinfo@gmail.com">yingmotorsinfo@gmail.com</a></dd>
            </div>
          </div>
          <div class="contact-item" id="wechat">
            <span class="contact-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 11.5c.4-3.2 3.2-5.5 6.4-5.2 2.8.2 5 2.4 5.3 5.2.2 2.2-.8 4.2-2.6 5.4l.4 2.6-2.6-1.1c-.8.2-1.6.3-2.4.2-3.4-.2-6.1-2.8-6.5-6.1-.1-.4-.1-.7 0-1z"/><path d="M6.2 17.2c-1.5-1-2.4-2.6-2.5-4.4-.3-3.6 2.3-6.8 5.8-7.4"/></svg>
            </span>
            <div>
              <dt data-i18n="contact_wechat"></dt>
              <dd>k18053729906</dd>
              <p class="muted contact-scan" data-i18n="contact_wechat_scan"></p>
              <img class="qr-card" src="contact/WeChatKate.jpg" alt="WeChat QR — Kate YingMotors, ID k18053729906">
            </div>
          </div>
        </dl>
      </aside>
      <form class="form-card" id="inquiry-form" novalidate>
        <p class="form-req-note" data-i18n="form_req_note"></p>
        <ul class="form-errors" id="form-errors" hidden aria-live="polite"></ul>
        <p class="form-status" id="form-status" hidden role="status" aria-live="polite"></p>
        <input class="form-hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-row">
          <div class="field">
            <label for="name" data-i18n="form_name"></label>
            <input id="name" name="name" autocomplete="name">
          </div>
          <div class="field">
            <label for="company" data-i18n="form_company"></label>
            <input id="company" name="company" autocomplete="organization">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="country"><span data-i18n="form_country"></span><span class="req" aria-hidden="true">*</span></label>
            <select id="country" name="country" autocomplete="country-name" aria-required="true"></select>
            <div class="country-other-field" id="country-other-wrap" hidden>
              <label for="country-other" data-i18n="form_country_other_label"></label>
              <input id="country-other" name="country_other" autocomplete="country-name" data-i18n-placeholder="form_country_other_placeholder" disabled>
            </div>
            <p class="field-hint" data-i18n="form_country_hint"></p>
          </div>
          <div class="field">
            <label for="port" data-i18n="form_port"></label>
            <input id="port" name="port">
          </div>
        </div>
        <fieldset class="contact-methods">
          <legend><span data-i18n="form_contact_group"></span><span class="req" aria-hidden="true">*</span></legend>
          <p class="field-hint" data-i18n="form_contact_hint"></p>
          <div class="form-row">
            <div class="field">
              <label for="email" data-i18n="form_email"></label>
              <input id="email" name="email" type="email" autocomplete="email">
            </div>
            <div class="field">
              <label for="whatsapp" data-i18n="form_whatsapp"></label>
              <input id="whatsapp" name="whatsapp" autocomplete="tel">
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="phone" data-i18n="form_phone"></label>
              <input id="phone" name="phone" autocomplete="tel">
            </div>
            <div class="field">
              <label for="wechat" data-i18n="form_wechat"></label>
              <input id="wechat" name="wechat">
            </div>
          </div>
        </fieldset>
        <div class="field">
          <label for="product" data-i18n="form_product"></label>
          <input id="product" name="product">
        </div>
        <div class="field">
          <label for="message" data-i18n="form_msg"></label>
          <textarea id="message" name="message"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn btn-gold" type="submit" id="form-submit" data-i18n="form_submit"></button>
        </div>
      </form>
    </div>
  </section>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/products.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
