# 工作流名称：部署网站到阿里云 OSS
name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          test -f web/index.html
          mkdir -p dist
          rsync -a \
            --exclude '.cursor/' \
            --exclude 'docs/' \
            --exclude 'images/' \
            --exclude 'bandlogo/' \
            --exclude 'banner-820x230/' \
            --exclude 'motorspicture/' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            --exclude '_footer-check.png' \
            ./web/ dist/

      - name: Sync files to OSS
        env:
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
        run: |
          python3 -m pip install -q oss2
          python3 <<'PY'
          import mimetypes
          import os
          import re
          import sys
          from pathlib import Path

          import oss2

          ak = os.environ.get("ALI_ACCESS_KEY_ID", "").strip().strip('"').strip("'")
          sk = os.environ.get("ALI_ACCESS_KEY_SECRET", "").strip().strip('"').strip("'")
          endpoint = os.environ.get("ALI_OSS_ENDPOINT", "").strip().strip('"').strip("'")
          bucket_name = os.environ.get("ALI_OSS_BUCKET", "").strip().strip('"').strip("'")

          print(f"AccessKeyId length={len(ak)} prefix={ak[:4]!r}")
          print(f"AccessKeySecret length={len(sk)}")
          print(f"Endpoint raw={endpoint!r}")
          print(f"Bucket raw={bucket_name!r}")

          if not all([ak, sk, endpoint, bucket_name]):
              print("::error::GitHub Secrets 缺失或名称不对。需要：ALI_ACCESS_KEY_ID, ALI_ACCESS_KEY_SECRET, ALI_OSS_ENDPOINT, ALI_OSS_BUCKET")
              sys.exit(1)

          endpoint = re.sub(r"^https?://", "", endpoint).strip("/")
          bucket_name = re.sub(r"^oss://", "", bucket_name).strip("/")
          match = re.search(r"(oss-[a-z0-9-]+\.aliyuncs\.com)$", endpoint)
          if match:
              endpoint = match.group(1)

          print(f"Using endpoint=https://{endpoint}")
          print(f"Using bucket={bucket_name}")

          auth = oss2.Auth(ak, sk)
          bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name)

          try:
              listed = list(oss2.ObjectIterator(bucket, max_keys=1))
              print(f"OSS reachable, sample objects={len(listed)}")
          except oss2.exceptions.OssError as e:
              print(f"::error::OSS 访问失败: status={e.status} code={e.code} message={e.message} request_id={e.request_id}")
              print("请核对：1) Secrets 名称和值 2) Endpoint 必须是桶所在地域 3) Bucket 只填桶名 4) RAM 要有 ListObjects/PutObject 5) 桶不要限制为仅国内 IP")
              sys.exit(1)

          root = Path("dist")
          local_keys = set()
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              key = path.relative_to(root).as_posix()
              local_keys.add(key)
              headers = {}
              ctype, _ = mimetypes.guess_type(path.name)
              if ctype:
                  headers["Content-Type"] = ctype
              bucket.put_object_from_file(key, str(path), headers=headers)
              print(f"uploaded {key}")

          remote_keys = {obj.key for obj in oss2.ObjectIterator(bucket) if not obj.key.endswith("/")}
          for key in sorted(remote_keys - local_keys):
              bucket.delete_object(key)
              print(f"deleted {key}")

          print(f"done. uploaded={len(local_keys)} deleted={len(remote_keys - local_keys)}")
          PY
