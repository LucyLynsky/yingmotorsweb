# 工作流名称：部署网站到阿里云 OSS
name: Deploy to Aliyun OSS

# 触发条件
on:
  push:
    branches: [main]
    paths-ignore:
      - "images/**"
      - "docs/**"
      - "README.md"
      - ".cursor/**"
  workflow_dispatch:

# 任务定义
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ossutil
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil version

      - name: Prepare site files
        run: |
          mkdir -p dist
          cp -a \
            index.html about.html contact.html custom.html \
            product.html products.html \
            favicon.ico robots.txt site.webmanifest \
            sitemap.html sitemap.xml \
            dist/
          cp -a assets css js contact product dist/

      - name: Configure ossutil
        env:
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
        run: |
          ossutil config \
            -e "$ALI_OSS_ENDPOINT" \
            -i "$ALI_ACCESS_KEY_ID" \
            -k "$ALI_ACCESS_KEY_SECRET" \
            -L CH

      - name: Sync files to OSS
        env:
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
        run: |
          ossutil sync ./dist/ "oss://${ALI_OSS_BUCKET}/" \
            --update \
            --delete \
            --force
