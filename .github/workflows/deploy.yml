# 工作流名称：部署网站到阿里云 OSS
name: Deploy to Aliyun OSS

# 触发条件
on:
  # 当代码推送到 main 分支时触发
  push:
    branches: [ main ]
  # 支持从 GitHub Actions 页面手动触发
  workflow_dispatch:

# 任务定义
jobs:
  # 部署任务
  deploy:
    # 运行环境：最新的 Ubuntu
    runs-on: ubuntu-latest
    # 执行步骤
    steps:
      # 步骤1：检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装 ossutil（阿里云 OSS 命令行工具）
      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/

      # 步骤3：配置 ossutil（使用 GitHub Secrets）
      - name: Configure ossutil
        env:
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
        run: |
          ossutil config \
            -e $ALI_OSS_ENDPOINT \
            -i $ALI_ACCESS_KEY_ID \
            -k $ALI_ACCESS_KEY_SECRET \
            -L CH

      # 步骤4：执行同步，将本地网站文件同步到 OSS 存储桶
      - name: Sync files to OSS
        env:
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
        run: |
          ossutil sync ./ oss://$ALI_OSS_BUCKET/ \
            --update \
            --delete \
            --force