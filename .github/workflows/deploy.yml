# 工作流名称：部署网站到阿里云 OSS
name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Prepare site files
        run: |
          test -f web/index.html
          mkdir -p dist
          rsync -a \
            --exclude '.cursor/' \
            --exclude 'docs/' \
            --exclude 'images/' \
            --exclude 'bandlogo/' \
            --exclude 'banner-820x230/' \
            --exclude 'motorspicture/' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            --exclude '_footer-check.png' \
            ./web/ dist/

      - name: Sync files to OSS
        env:
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${ALI_ACCESS_KEY_ID:-}" ] || [ -z "${ALI_ACCESS_KEY_SECRET:-}" ] || [ -z "${ALI_OSS_ENDPOINT:-}" ] || [ -z "${ALI_OSS_BUCKET:-}" ]; then
            echo "Missing secrets. Need ALI_ACCESS_KEY_ID, ALI_ACCESS_KEY_SECRET, ALI_OSS_ENDPOINT, ALI_OSS_BUCKET"
            exit 1
          fi

          ENDPOINT="${ALI_OSS_ENDPOINT#https://}"
          ENDPOINT="${ENDPOINT#http://}"
          ENDPOINT="${ENDPOINT%/}"
          BUCKET="${ALI_OSS_BUCKET#oss://}"
          BUCKET="${BUCKET%/}"

          echo "Endpoint: $ENDPOINT"
          echo "Bucket: $BUCKET"

          export RCLONE_CONFIG_OSS_TYPE=s3
          export RCLONE_CONFIG_OSS_PROVIDER=Alibaba
          export RCLONE_CONFIG_OSS_ACCESS_KEY_ID="$ALI_ACCESS_KEY_ID"
          export RCLONE_CONFIG_OSS_SECRET_ACCESS_KEY="$ALI_ACCESS_KEY_SECRET"
          export RCLONE_CONFIG_OSS_ENDPOINT="$ENDPOINT"
          export RCLONE_CONFIG_OSS_NO_CHECK_BUCKET=true

          rclone lsf "oss:${BUCKET}" --max-depth 1 >/dev/null
          rclone sync ./dist "oss:${BUCKET}" \
            --progress \
            --s3-no-check-bucket
