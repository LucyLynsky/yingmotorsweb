# 工作流名称：部署网站到阿里云 OSS
name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Prepare site files
        run: |
          test -f web/index.html
          mkdir -p dist
          rsync -a \
            --exclude '.cursor/' \
            --exclude 'docs/' \
            --exclude 'images/' \
            --exclude 'bandlogo/' \
            --exclude 'banner-820x230/' \
            --exclude 'motorspicture/' \
            --exclude 'tools/' \
            --exclude 'README.md' \
            --exclude '_footer-check.png' \
            ./web/ dist/

      - name: Configure rclone for OSS
        env:
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
        run: |
          if [ -z "$ALI_ACCESS_KEY_ID" ] || [ -z "$ALI_ACCESS_KEY_SECRET" ] || [ -z "$ALI_OSS_ENDPOINT" ]; then
            echo "Missing secrets: ALI_ACCESS_KEY_ID, ALI_ACCESS_KEY_SECRET, ALI_OSS_ENDPOINT"
            exit 1
          fi
          ENDPOINT="${ALI_OSS_ENDPOINT#https://}"
          ENDPOINT="${ENDPOINT#http://}"
          rclone config create oss s3 \
            provider=Alibaba \
            env_auth=false \
            access_key_id="$ALI_ACCESS_KEY_ID" \
            secret_access_key="$ALI_ACCESS_KEY_SECRET" \
            endpoint="$ENDPOINT" \
            acl=public-read

      - name: Sync files to OSS
        env:
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
        run: |
          if [ -z "$ALI_OSS_BUCKET" ]; then
            echo "Missing secret: ALI_OSS_BUCKET"
            exit 1
          fi
          rclone sync ./dist "oss:${ALI_OSS_BUCKET}" \
            --progress \
            --update \
            --fast-list
