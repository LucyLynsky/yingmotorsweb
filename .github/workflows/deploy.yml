# 工作流名称：部署网站到阿里云 OSS
name: Deploy to Aliyun OSS

# 触发条件
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 任务定义
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/

      - name: Configure ossutil
        env:
          ALI_ACCESS_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_ACCESS_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ALI_OSS_ENDPOINT: ${{ secrets.ALI_OSS_ENDPOINT }}
        run: |
          ossutil config \
            -e $ALI_OSS_ENDPOINT \
            -i $ALI_ACCESS_KEY_ID \
            -k $ALI_ACCESS_KEY_SECRET \
            -L CH

      - name: Sync files to OSS
        env:
          ALI_OSS_BUCKET: ${{ secrets.ALI_OSS_BUCKET }}
        run: |
          ossutil sync ./web/ oss://$ALI_OSS_BUCKET/ --update --delete --force