# 工作流名称：将图片同步到 R2 存储桶
name: Sync images to R2

# 触发条件
on:
  # 当代码推送到 main 分支时触发
  push:
    branches: [ main ]
    # 只有 resource/images 目录下的文件发生变化时才运行
    paths:
      - 'resource/images/**'
  # 支持从 GitHub Actions 页面手动触发
  workflow_dispatch:

# 任务定义
jobs:
  # 同步任务
  sync:
    # 运行环境：最新的 Ubuntu
    runs-on: ubuntu-latest
    # 执行步骤
    steps:
      # 步骤1：检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装 rclone 同步工具
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # 步骤3：配置 rclone 连接到 Cloudflare R2
      - name: Configure R2 connection
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id=$R2_ACCESS_KEY_ID \
            secret_access_key=$R2_SECRET_ACCESS_KEY \
            endpoint=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com \
            acl=public-read

      # 步骤4：执行同步，将本地 resource/images 目录同步到 R2 存储桶
      - name: Sync files to R2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          rclone sync ./resource/images r2:$R2_BUCKET_NAME/web/images \
            --progress \
            --verbose \
            --update \
            --delete-excluded